services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lineskip
      POSTGRES_PASSWORD: lineskip
      POSTGRES_DB: lineskip
    ports:
      - "5432:5432"
    volumes:
      - lineskip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineskip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lineskip_pg:
